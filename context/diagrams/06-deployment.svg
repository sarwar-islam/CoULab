   <g id="text_1">
    <text style="fill: #1b2a24; font: 700 17px 'DejaVu Sans'; text-anchor: start" x="21.6" y="41.717344" transform="rotate(-0 21.6 41.717344)">6. Deployment: Vercel free (Hobby) plan, or any Node 22 host</text>
   </g>
   <g id="text_2">
    <text style="fill: #5b6b64; font: 10.5px 'DejaVu Sans'; text-anchor: start" x="21.6" y="69.898359" transform="rotate(-0 21.6 69.898359)">No build step, no dependencies, no environment variables.</text>
   </g>
   <g id="text_3">
    <text style="fill: #1b2a24; font: 700 10.5px 'DejaVu Sans'; text-anchor: middle" x="93.6" y="211.018359" transform="rotate(-0 93.6 211.018359)">Browser / PWA</text>
   </g>
   <g id="text_4">
    <text style="fill: #5b6b64; font: 8.5px 'DejaVu Sans'" transform="translate(46.381172 232.538672)">service worker caches</text>
    <text style="fill: #5b6b64; font: 8.5px 'DejaVu Sans'" transform="translate(66.039414 243.67148)">the app shell</text>
    <text style="fill: #5b6b64; font: 8.5px 'DejaVu Sans'" transform="translate(57.150938 254.804289)">outbox for offline</text>
   </g>
   <g id="text_5">
    <text style="fill: #1b2a24; font: 700 9.5px 'DejaVu Sans'; text-anchor: start" x="226.8" y="102.258516" transform="rotate(-0 226.8 102.258516)">VERCEL</text>
   </g>
   <g id="text_6">
    <text style="fill: #1b2a24; font: 700 10.5px 'DejaVu Sans'; text-anchor: middle" x="352.8" y="153.418359" transform="rotate(-0 352.8 153.418359)">Edge CDN</text>
   </g>
   <g id="text_7">
    <text style="fill: #5b6b64; font: 8.5px 'DejaVu Sans'" transform="translate(315.52418 174.938672)">public/ static files</text>
    <text style="fill: #5b6b64; font: 8.5px 'DejaVu Sans'" transform="translate(291.109922 186.07148)">index.html, css, js, img, sw.js</text>
   </g>
   <g id="text_8">
    <text style="fill: #1b2a24; font: 700 10.5px 'DejaVu Sans'; text-anchor: middle" x="597.6" y="160.618359" transform="rotate(-0 597.6 160.618359)">Serverless function</text>
   </g>
   <g id="text_9">
    <text style="fill: #5b6b64; font: 8.5px 'DejaVu Sans'" transform="translate(537.883516 182.138672)">api/index.js -&gt; server/app.js</text>
    <text style="fill: #5b6b64; font: 8.5px 'DejaVu Sans'" transform="translate(553.453125 193.27148)">Node 22, node:sqlite</text>
   </g>
   <g id="text_10">
    <text style="fill: #1b2a24; font: 700 10.5px 'DejaVu Sans'; text-anchor: middle" x="597.6" y="326.218359" transform="rotate(-0 597.6 326.218359)">/tmp/ainshohay</text>
   </g>
   <g id="text_11">
    <text style="fill: #5b6b64; font: 8.5px 'DejaVu Sans'" transform="translate(564.813242 347.738672)">dev.db (SQLite)</text>
    <text style="fill: #5b6b64; font: 8.5px 'DejaVu Sans'" transform="translate(524.448203 358.87148)">app-db.json (seeded on cold start)</text>
    <text style="fill: #5b6b64; font: 8.5px 'DejaVu Sans'" transform="translate(579.479063 370.004289)">uploads/</text>
   </g>
   <g id="text_12">
    <text style="fill: #1b2a24; font: 700 10.5px 'DejaVu Sans'; text-anchor: middle" x="352.8" y="326.218359" transform="rotate(-0 352.8 326.218359)">vercel.json rewrites</text>
   </g>
   <g id="text_13">
    <text style="fill: #5b6b64; font: 8.5px 'DejaVu Sans'" transform="translate(314.820938 347.738672)">/api/*  -&gt; function</text>
    <text style="fill: #5b6b64; font: 8.5px 'DejaVu Sans'" transform="translate(294.96082 358.87148)">/data/uploads/* -&gt; function</text>
    <text style="fill: #5b6b64; font: 8.5px 'DejaVu Sans'" transform="translate(297.795703 370.004289)">other paths -&gt; index.html</text>
   </g>

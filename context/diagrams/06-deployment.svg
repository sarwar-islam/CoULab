   </g>
   <g id="text_16">
    <text style="fill: #1b2a24; font: 700 10.5px 'DejaVu Sans'; text-anchor: middle" x="885.6" y="153.418359" transform="rotate(-0 885.6 153.418359)">Persistent option</text>
   </g>
   <g id="text_17">
    <text style="fill: #5b6b64; font: 8.5px 'DejaVu Sans'" transform="translate(839.055195 174.938672)">npm start on Railway,</text>
    <text style="fill: #5b6b64; font: 8.5px 'DejaVu Sans'" transform="translate(851.297188 186.07148)">Render or a VPS</text>
    <text style="fill: #5b6b64; font: 8.5px 'DejaVu Sans'" transform="translate(829.772266 197.204289)">DATA_DIR = mounted disk</text>
    <text style="fill: #5b6b64; font: 8.5px 'DejaVu Sans'" transform="translate(843.720234 208.573504)">or swap server/db/*</text>
    <text style="fill: #5b6b64; font: 8.5px 'DejaVu Sans'" transform="translate(838.933672 219.706312)">for managed Postgres</text>
   </g>
   <g id="text_18">
    <text style="fill: #5b6b64; font: 8.5px 'DejaVu Sans'" transform="translate(777.6 337.658672)">Same code, same handler:</text>
    <text style="fill: #5b6b64; font: 8.5px 'DejaVu Sans'" transform="translate(777.6 347.176812)">server.js wraps it as a</text>
    <text style="fill: #5b6b64; font: 8.5px 'DejaVu Sans'" transform="translate(777.6 356.694953)">long-running HTTP server.</text>
   </g>

   <g id="text_1">
    <text style="fill: #1b2a24; font: 700 17px 'DejaVu Sans'; text-anchor: start" x="21.6" y="41.717344" transform="rotate(-0 21.6 41.717344)">5. One login and bounded access</text>
   </g>
   <g id="text_2">
    <text style="fill: #5b6b64; font: 10.5px 'DejaVu Sans'; text-anchor: start" x="21.6" y="69.898359" transform="rotate(-0 21.6 69.898359)">One form for all users; the server decides the account type. The access guard runs before any case data is read.</text>
   </g>
   <g id="text_3">
    <text style="fill: #1b2a24; font: 700 10.5px 'DejaVu Sans'; text-anchor: middle" x="93.6" y="153.418359" transform="rotate(-0 93.6 153.418359)">Login form</text>
   </g>
   <g id="text_4">
    <text style="fill: #5b6b64; font: 8.5px 'DejaVu Sans'" transform="translate(61.268125 174.938672)">identifier + PIN</text>
    <text style="fill: #5b6b64; font: 8.5px 'DejaVu Sans'" transform="translate(57.603828 186.07148)">(one form for all)</text>
   </g>
   <g id="text_5">
    <text style="fill: #1b2a24; font: 700 10.5px 'DejaVu Sans'; text-anchor: middle" x="302.4" y="153.418359" transform="rotate(-0 302.4 153.418359)">Throttle</text>
   </g>
   <g id="text_6">
    <text style="fill: #5b6b64; font: 8.5px 'DejaVu Sans'" transform="translate(268.220039 174.938672)">5 wrong PINs -&gt;</text>
    <text style="fill: #5b6b64; font: 8.5px 'DejaVu Sans'" transform="translate(256.874531 186.07148)">10 min lock (audited)</text>
   </g>
   <g id="text_7">
    <text style="fill: #1b2a24; font: 700 10.5px 'DejaVu Sans'; text-anchor: middle" x="532.8" y="153.418359" transform="rotate(-0 532.8 153.418359)">POST /api/auth</text>
   </g>
   <g id="text_8">
    <text style="fill: #5b6b64; font: 8.5px 'DejaVu Sans'" transform="translate(508.399688 174.938672)">mode: auto</text>
    <text style="fill: #5b6b64; font: 8.5px 'DejaVu Sans'" transform="translate(477.34082 186.07148)">is it a provider username?</text>
   </g>
   <g id="text_9">
    <text style="fill: #1b2a24; font: 700 10.5px 'DejaVu Sans'; text-anchor: middle" x="828" y="81.418359" transform="rotate(-0 828 81.418359)">Provider</text>
   </g>
   <g id="text_10">
    <text style="fill: #5b6b64; font: 8.5px 'DejaVu Sans'; text-anchor: middle" x="828" y="102.938672" transform="rotate(-0 828 102.938672)">own PIN hash (no master PIN) -&gt; HttpOnly session</text>
   </g>
   <g id="text_11">
    <text style="fill: #1b2a24; font: 700 10.5px 'DejaVu Sans'; text-anchor: middle" x="828" y="225.418359" transform="rotate(-0 828 225.418359)">Citizen</text>
   </g>

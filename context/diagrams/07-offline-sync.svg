   <g id="text_1">
    <text style="fill: #1b2a24; font: 700 17px 'DejaVu Sans'; text-anchor: start" x="21.6" y="41.717344" transform="rotate(-0 21.6 41.717344)">7. Offline-first sync (T9) for UDC centres and weak networks</text>
   </g>
   <g id="text_2">
    <text style="fill: #5b6b64; font: 10.5px 'DejaVu Sans'; text-anchor: start" x="21.6" y="69.898359" transform="rotate(-0 21.6 69.898359)">Records created offline follow exactly the same path as online ones, so there is no second-class record.</text>
   </g>
   <g id="text_3">
    <text style="fill: #1b2a24; font: 700 10px 'DejaVu Sans'; text-anchor: middle" x="93.6" y="174.638438" transform="rotate(-0 93.6 174.638438)">1. Capture</text>
   </g>
   <g id="text_4">
    <text style="fill: #5b6b64; font: 8px 'DejaVu Sans'" transform="translate(61.42875 196.15875)">form submitted,</text>
    <text style="fill: #5b6b64; font: 8px 'DejaVu Sans'" transform="translate(65.291875 206.636687)">network down</text>
   </g>
   <g id="text_5">
    <text style="fill: #1b2a24; font: 700 10px 'DejaVu Sans'; text-anchor: middle" x="257.76" y="174.638438" transform="rotate(-0 257.76 174.638438)">2. Outbox</text>
   </g>
   <g id="text_6">
    <text style="fill: #5b6b64; font: 8px 'DejaVu Sans'" transform="translate(222.48 196.15875)">localStorage item</text>
    <text style="fill: #5b6b64; font: 8px 'DejaVu Sans'" transform="translate(230.764375 206.636687)">+ client UUID</text>
    <text style="fill: #5b6b64; font: 8px 'DejaVu Sans'" transform="translate(231.054375 217.114625)">+ capturedAt</text>
   </g>
   <g id="text_7">
    <text style="fill: #1b2a24; font: 700 10px 'DejaVu Sans'; text-anchor: middle" x="421.92" y="174.638438" transform="rotate(-0 421.92 174.638438)">3. Reconnect</text>
   </g>
   <g id="text_8">
    <text style="fill: #5b6b64; font: 8px 'DejaVu Sans'" transform="translate(389.4925 196.15875)">'online' event or</text>
    <text style="fill: #5b6b64; font: 8px 'DejaVu Sans'" transform="translate(391.975 206.636687)">next page load</text>
   </g>
   <g id="text_9">
    <text style="fill: #1b2a24; font: 700 10px 'DejaVu Sans'; text-anchor: middle" x="586.08" y="174.638438" transform="rotate(-0 586.08 174.638438)">4. /api/sync_push</text>
   </g>
   <g id="text_10">
    <text style="fill: #5b6b64; font: 8px 'DejaVu Sans'" transform="translate(552.424375 196.15875)">syncLog: clientId</text>
    <text style="fill: #5b6b64; font: 8px 'DejaVu Sans'" transform="translate(548.88625 206.636687)">already seen? skip</text>
   </g>
   <g id="text_11">
    <text style="fill: #1b2a24; font: 700 10px 'DejaVu Sans'; text-anchor: middle" x="750.24" y="174.638438" transform="rotate(-0 750.24 174.638438)">5. applications_POST</text>
   </g>
   <g id="text_12">
    <text style="fill: #5b6b64; font: 8px 'DejaVu Sans'" transform="translate(708.35625 196.15875)">same path as online:</text>
    <text style="fill: #5b6b64; font: 8px 'DejaVu Sans'" transform="translate(707.400625 206.636687)">store + spine + audit</text>
   </g>
   <g id="text_13">
    <text style="fill: #1b2a24; font: 700 10px 'DejaVu Sans'; text-anchor: middle" x="914.4" y="174.638438" transform="rotate(-0 914.4 174.638438)">6. Result</text>
   </g>
   <g id="text_14">
    <text style="fill: #5b6b64; font: 8px 'DejaVu Sans'" transform="translate(882.2525 196.15875)">real appId back,</text>
    <text style="fill: #5b6b64; font: 8px 'DejaVu Sans'" transform="translate(884.570625 206.636687)">outbox cleared</text>
   </g>
   <g id="text_15">
    <text style="fill: #1b2a24; font: 9.5px 'DejaVu Sans'; text-anchor: start" x="21.6" y="331.2" transform="rotate(-0 21.6 331.2)">Idempotent: replaying the same item returns 'duplicate-skipped' with the original appId (covered by tests).</text>
   </g>
   <g id="text_16">
    <text style="fill: #1b2a24; font: 9.5px 'DejaVu Sans'; text-anchor: start" x="21.6" y="363.6" transform="rotate(-0 21.6 363.6)">Provenance: offlineCreated, tempUuid, source (udc-assisted / applicant-device) and capture time are kept on the record.</text>
   </g>
   <g id="text_17">
    <text style="fill: #5b6b64; font: 9.5px 'DejaVu Sans'; text-anchor: start" x="21.6" y="396" transform="rotate(-0 21.6 396)">Service worker: the app shell loads with no connection; API responses are never cached, so status is always live and no personal data sits in the cache.</text>
   </g>
  </g>
 </g>

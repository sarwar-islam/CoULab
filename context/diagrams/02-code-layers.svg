   <g id="text_1">
    <text style="fill: #1b2a24; font: 700 17px 'DejaVu Sans'; text-anchor: start" x="21.6" y="41.717344" transform="rotate(-0 21.6 41.717344)">2. Code architecture: layered, one handler for local and serverless</text>
   </g>
   <g id="text_2">
    <text style="fill: #5b6b64; font: 10.5px 'DejaVu Sans'; text-anchor: start" x="21.6" y="69.898359" transform="rotate(-0 21.6 69.898359)">Routes stay thin, domain rules live in services, storage sits behind server/db so it can move to Postgres.</text>
   </g>
   <g id="text_3">
    <text style="fill: #1b2a24; font: 700 10.5px 'DejaVu Sans'; text-anchor: middle" x="122.4" y="137.496328" transform="rotate(-0 122.4 137.496328)">Entry points</text>
   </g>
   <g id="text_4">
    <text style="fill: #1b2a24; font: 9.5px 'DejaVu Sans'; text-anchor: middle" x="568.8" y="137.150078" transform="rotate(-0 568.8 137.150078)">server.js (local server)   |   api/index.js (Vercel function)</text>
   </g>
   <g id="text_5">
    <text style="fill: #1b2a24; font: 700 10.5px 'DejaVu Sans'; text-anchor: middle" x="122.4" y="199.457344" transform="rotate(-0 122.4 199.457344)">HTTP application</text>
   </g>
   <g id="text_6">
    <text style="fill: #1b2a24; font: 9.5px 'DejaVu Sans'; text-anchor: middle" x="568.8" y="199.181406" transform="rotate(-0 568.8 199.181406)">server/app.js: CORS, body parsing, session context, error handling</text>
   </g>
   <g id="text_7">
    <text style="fill: #1b2a24; font: 700 10.5px 'DejaVu Sans'; text-anchor: middle" x="122.4" y="261.336328" transform="rotate(-0 122.4 261.336328)">Router + access guard</text>
   </g>
   <g id="text_8">
    <text style="fill: #1b2a24; font: 9.5px 'DejaVu Sans'; text-anchor: middle" x="568.8" y="261.101406" transform="rotate(-0 568.8 261.101406)">server/router.js: /api/&lt;root&gt; dispatch table, providerOnly(), login throttle</text>
   </g>
   <g id="text_9">
    <text style="fill: #1b2a24; font: 700 10.5px 'DejaVu Sans'; text-anchor: middle" x="122.4" y="323.297344" transform="rotate(-0 122.4 323.297344)">Routes (thin)</text>
   </g>
   <g id="text_10">
    <text style="fill: #1b2a24; font: 9.5px 'DejaVu Sans'; text-anchor: middle" x="568.8" y="323.021406" transform="rotate(-0 568.8 323.021406)">server/routes/*.js: applications, cases, referrals, mediation, lawyer, sync, audit ...</text>
   </g>
   <g id="text_11">
    <text style="fill: #1b2a24; font: 700 10.5px 'DejaVu Sans'; text-anchor: middle" x="122.4" y="385.217344" transform="rotate(-0 122.4 385.217344)">Domain services</text>
   </g>
   <g id="text_12">
    <text style="fill: #1b2a24; font: 9.5px 'DejaVu Sans'; text-anchor: middle" x="568.8" y="384.941406" transform="rotate(-0 568.8 384.941406)">server/services/*.js: lifecycle, triage, audit chain, safe contact, duplicates, AI engines</text>
   </g>
   <g id="text_13">
    <text style="fill: #1b2a24; font: 700 10.5px 'DejaVu Sans'; text-anchor: middle" x="122.4" y="447.137344" transform="rotate(-0 122.4 447.137344)">Data access</text>
   </g>
   <g id="text_14">
    <text style="fill: #1b2a24; font: 9.5px 'DejaVu Sans'; text-anchor: middle" x="568.8" y="446.750078" transform="rotate(-0 568.8 446.750078)">server/db/sqlite.js (case spine)   |   server/db/json-store.js (portal store)</text>
   </g>
   <g id="text_15">
    <text style="fill: #1b2a24; font: 700 10.5px 'DejaVu Sans'; text-anchor: middle" x="122.4" y="509.057344" transform="rotate(-0 122.4 509.057344)">Domain + content</text>
   </g>
   <g id="text_16">
    <text style="fill: #1b2a24; font: 9.5px 'DejaVu Sans'; text-anchor: middle" x="568.8" y="508.670078" transform="rotate(-0 568.8 508.670078)">server/domain/constants.js   |   server/content/portal-content.js   |   server/config.js</text>
   </g>
   <g id="text_17">
    <text style="fill: #5b6b64; font: 9px 'DejaVu Sans'; text-anchor: start" x="28.8" y="583.2" transform="rotate(-0 28.8 583.2)">Browser code: public/js/app.js (portal, login, outbox, read-aloud) | public/js/console.js (7 roles) | public/sw.js (offline shell)</text>
   </g>
  </g>
 </g>
